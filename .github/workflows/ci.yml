name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: python -m venv .venv
      - run: .venv/bin/pip install -r backend/requirements.txt
      - run: .venv/bin/pytest -q

      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

      - uses: hashicorp/setup-terraform@v4

      - run: terraform -chdir=infra/terraform fmt -check
      - run: terraform -chdir=infra/terraform init -backend=false
      - run: terraform -chdir=infra/terraform validate

      - run: docker compose config --quiet
      - run: bash -n scripts/start_demo.sh scripts/teardown_releaseguard.sh
